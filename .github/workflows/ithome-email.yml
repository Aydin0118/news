name: IT之家每日邮件推送

# 触发规则：定时触发（UTC时间0点 = 北京时间8点）+ 手动触发
on:
  schedule:
    - cron: '0 0 * * *'  # 每天UTC0点执行（北京时间8点），可调整：比如0 1 * * * = 北京时间9点
  workflow_dispatch:  # 允许手动触发测试

# 作业配置
jobs:
  send-ithome-email:
    runs-on: ubuntu-latest  # 使用Ubuntu系统
    
    steps:
      # 1. 拉取仓库代码
      - name: 拉取代码
        uses: actions/checkout@v4
      
      # 2. 设置Python环境
      - name: 配置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'  # 指定Python版本
      
      # 3. 安装依赖
      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # 4. 运行脚本发送邮件
      - name: 执行爬取并发送邮件
        env:
          # 从GitHub Secrets读取敏感信息
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_AUTH_CODE: ${{ secrets.SENDER_AUTH_CODE }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}  # 可选，默认qq邮箱
          SMTP_PORT: ${{ secrets.SMTP_PORT }}      # 可选，默认465
        run: python ithome2email.py
